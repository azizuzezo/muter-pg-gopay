version: '3.8'

services:
  gopay-gateway:
    build: .
    container_name: gopay-gateway
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - GOPAY_SESSION_FILE=/data/gopay-session.json
    volumes:
      - gopay-session:/data

volumes:
  gopay-session:
